# Políticas de Governança Federada (formato interno)
# 
# NOTA: Os contratos de dados deste repositório são escritos no padrão
# Open Data Contract Standard (ODCS) v3 — Bitol. Este arquivo YAML
# permanece no formato interno metadata/spec porque é consumido
# diretamente pelos validadores de governança, que primeiro normalizam
# os contratos ODCS via odcs_adapter.py.
apiVersion: v1
kind: GovernancePolicies
metadata:
  name: data-mesh-governance
  version: "1.0.0"
  owner: "data-office@empresa.com"
  created_at: "2026-01-15T00:00:00Z"
  last_modified: "2026-01-15T00:00:00Z"
  tags: ["governance", "data-mesh", "v1"]
# ─────────────────────────────────────────────────────────────────────────────
# ANOTAÇÃO DE APLICABILIDADE (`enforcement`)
#
# Cada seção declara se é verificada por mecanismo automatizado ou se permanece
# declaratória. Governança computacional federada pressupõe política executável;
# esta PoC, porém, não tem runtime servindo os produtos, e várias seções descrevem
# processo humano (aprovação, notificação, auditoria) ou métrica de operação
# (latência observada, taxa de erro, orçamento de erro) que não existem aqui.
#
#   automated   : há checagem correspondente; o nome dela está em `verified_by`
#   declaratory : sem verificação; `reason` explica por quê
#
# A anotação existe para que a distinção seja legível no próprio artefato, em vez
# de descoberta por inspeção do código. Política declaratória não é defeito —
# defeito é não saber quais delas são apenas declaratórias.
# ─────────────────────────────────────────────────────────────────────────────
spec:
  description: "Políticas corporativas de governança para Data Mesh"
  
  # Padrões Federados
  standards:
    naming:
      enforcement: automated          # verified_by: check_naming
      convention: "snake_case"
      # Campos que todo output port analítico deve publicar. Os nomes anteriores
      # (id, created_at, updated_at) vinham de sistema transacional e não
      # existiam em nenhum produto — política inaplicável por construção.
      required_fields: ["invoice_id", "dt_versao"]
      max_field_name_length: 50
      forbidden_patterns: ["temp_", "test_", "debug_"]
    
    quality:
      # min_freshness e min_availability: check_slas.
      # max_error_rate, amount_tolerance e allowed_currencies são consumidos pela
      # camada de qualidade a partir das regras do contrato, não pela governança.
      enforcement: automated          # verified_by: check_slas
      max_error_rate: 0.05  # 5%
      min_freshness: "P1D"   # produtos analíticos batch (output ports)
      min_availability: "99.0%"
      max_staleness: "P1D"
      amount_tolerance: 0.01
      allowed_currencies: ["BRL"]
    
    # Data Observability (QoS Avançado)
    observability:
      enforcement: declaratory
      # reason: exige coleta contínua (frequência de medição, alerta, deriva de
      # esquema em runtime). A PoC materializa em lote e não observa execução.
      data_freshness:
        enabled: true
        threshold: "PT6H"
        alert_threshold: "PT8H"
        measurement_frequency: "PT1H"
      
      schema_drift:
        enabled: true
        check_frequency: "PT24H"
        alert_on_changes: true
        breaking_change_detection: true
      
      volume_anomalies:
        enabled: true
        baseline_window: "P7D"
        deviation_threshold: 0.25  # 25%
        alert_threshold: 0.50    # 50%
      
      quality_degradation:
        enabled: true
        quality_metrics: ["completeness", "accuracy", "validity"]
        degradation_threshold: 0.10  # 10%
        recovery_sla: "PT2H"
      
      lineage_tracking:
        enabled: true
        upstream_dependencies: true
        downstream_impacts: true
        change_propagation: true
    
    # Error Budgets (SRE Principles)
    error_budgets:
      enforcement: declaratory
      # reason: orçamento de erro pressupõe série histórica de disponibilidade,
      # que não existe sem serviço em operação.
      monthly_budget: "99.9%"
      weekly_budget: "99.5%"
      daily_budget: "99.0%"
      
      burn_rate_alerts:
        warning_threshold: 0.80  # 80% do budget consumido
        critical_threshold: 0.95  # 95% do budget consumido
      
      outage_classification:
        critical:
          availability_impact: ">5%"
          recovery_time: ">PT1H"
          budget_impact: "high"
        major:
          availability_impact: "1-5%"
          recovery_time: "PT15M-PT1H"
          budget_impact: "medium"
        minor:
          availability_impact: "<1%"
          recovery_time: "<PT15M"
          budget_impact: "low"
      
      budget_calculation:
        include_maintenance: false
        include_planned_outages: false
        measurement_window: "P30D"
    
    # Data Reliability Metrics
    reliability:
      enforcement: declaratory
      # reason: MTTR, MTBF, RTO/RPO e estratégia de backup descrevem operação de
      # plataforma; não há o que medir num conjunto de arquivos versionados.
      mean_time_to_recovery: "PT1H"
      mean_time_between_failures: "P30D"
      data_loss_prevention: "zero_loss"
      
      recovery_objectives:
        rto: "PT4H"  # Recovery Time Objective
        rpo: "PT1H"  # Recovery Point Objective
        
      backup_strategy:
        frequency: "PT6H"
        retention: "P90D"
        verification: "weekly"
        
      disaster_recovery:
        site_recovery: "PT24H"
        data_replication: "async"
        failover_automation: true
    
    # Performance Metrics
    performance:
      enforcement: declaratory
      # reason: tempos de resposta e vazão observados exigem serviço atendendo
      # consultas. O compromisso DECLARADO é verificado em check_slas
      # (latency_compliance e throughput_compliance).
      query_performance:
        response_time_p50: "PT2S"
        response_time_p95: "PT5S"
        response_time_p99: "PT10S"
        timeout_threshold: "PT30S"
      
      batch_processing:
        max_processing_time: "PT30M"
        parallel_jobs: 4
        resource_utilization: 0.80  # 80%
        
      streaming:
        max_lag: "PT5S"
        throughput_min: "1000 msg/s"
        consumer_lag_threshold: "PT10S"
        
      scalability:
        max_concurrent_users: 100
        peak_load_multiplier: 2.0
        auto_scaling_enabled: true
    
    security:
      enforcement: automated          # verified_by: check_security (pii_fields)
      # Limitação: verifica-se que o produto classifica os dados e enumera seus
      # atributos sensíveis. Cifra, RBAC e retenção de auditoria são
      # propriedades da plataforma, ausentes nesta PoC.
      encryption: "AES-256"
      access_control: "RBAC"
      audit_retention: "P365D"
      # Nomes como publicados nos output ports analíticos.
      pii_fields: ["id_cliente", "id_fornecedor", "email", "phone"]
    
    evolution:
      enforcement: automated          # verified_by: check_evolution
      # Limitação: verifica a ADESÃO DECLARADA do contrato à política. Detectar
      # quebra concreta exigiria comparar o esquema com a versão anterior, e a
      # PoC não mantém registro de versões.
      backward_compatibility: true
      breaking_changes: "require_major_version"
      deprecation_period: "P90D"
      notification_period: "P30D"
    
    documentation:
      enforcement: automated          # verified_by: check_documentation
      description_required: true
      examples_required: true
  
  # Contratos Obrigatórios
  # enforcement: automated — verified_by: check_required_sections
  # Limitação conhecida: a checagem testa presença de chave na visão
  # normalizada, e o odcs_adapter cria todas as chaves com valor padrão. Na
  # prática nenhuma ausência é detectável por aqui; as exigências efetivas de
  # conteúdo estão em required_fields, global_quality_rules e interoperability.
  required_contract_sections:
    - metadata
    - spec.product
    - spec.dataset
    - spec.quality
    - spec.schema
    - spec.tests
    - spec.consumers
    - spec.monitoring
  
  # Campos Obrigatórios para Produtos Analíticos (Output Ports)
  # Esta malha publica apenas produtos analíticos agregados (consumer-aligned).
  # Dados operacionais brutos permanecem como camada de entrada não publicada.
  # enforcement: automated — verified_by: check_required_fields
  required_fields:
    enforcement: automated
    aggregate:
      - "dt_versao"     # quando o output port foi materializado (UTC)
      - "dsc_dominio"   # domínio dono do produto
      - "dsc_produto"   # nome do produto de dados
      - "dsc_moeda"     # padrão semântico ISO-4217

    
    measures:
      - "count"          # alguma contagem (invoice_count, operation_count, ...)
      - "total"          # alguma soma (total_amount, total_value, ...)
  
  # Regras de Qualidade Globais
  # enforcement: automated — verified_by: check_quality_rules
  # Limitação: a checagem confirma que o contrato declara regra sobre o campo
  # alvo, por correspondência textual; ela não avalia a expressão. A avaliação
  # real acontece na camada de qualidade, que executa as expressões declaradas
  # em cada contrato contra os dados.
  global_quality_rules:
    # ATENÇÃO — os nomes em `applies_to` devem ser os dos atributos PUBLICADOS
    # pelos output ports. Antes desta correção nove das onze regras apontavam
    # para nomes inexistentes na malha (amount, currency, updated_at, ...), e
    # `check_quality_rules` as aprovava por vacuidade: sem interseção entre
    # `applies_to` e os campos do contrato, a regra é considerada inaplicável e
    # passa. Regra global só é verificável se falar o vocabulário dos produtos.
    - id: "positive_amounts"
      description: "Valores monetários devem ser positivos"
      expression: "valor > 0"
      applies_to: ["valor_liquido", "valor_bruto", "valor_total", "valor_base"]
      severity: "error"
    
    - id: "valid_currency"
      description: "Moeda deve ser BRL (operações nacionais)"
      expression: "dsc_moeda == 'BRL'"
      applies_to: ["dsc_moeda"]
      severity: "error"
    
    - id: "valid_status"
      description: "Status deve estar na lista permitida"
      expression: "status IN ['OPEN', 'PAID', 'SETTLED', 'CANCELED', 'CANCELLED', 'PENDING', 'PROCESSING', 'COMPLETED']"
      applies_to: ["status"]
      severity: "error"
    
    - id: "non_null_ids"
      description: "IDs não podem ser nulos"
      expression: "id IS NOT NULL AND id != ''"
      applies_to: ["id", "invoice_id", "id_cliente", "id_fornecedor", "operation_id"]
      severity: "error"
    
    # Removidas desta seção, por não serem regras sobre atributo publicado:
    #
    #   recent_updates, data_freshness_compliance
    #     Frescor não é atributo do registro, e sim propriedade da
    #     materialização. É verificado em standards.quality.min_freshness
    #     (governança, contra o SLA declarado) e na dimensão de atualidade de
    #     platform/quality/validate_data_quality.py (contra o dt_versao real).
    #
    #   schema_compatibility
    #     Depende de comparar o esquema com a versão anterior; a PoC não mantém
    #     registro de versões. A adesão declarada está em standards.evolution.
    #
    #   volume_consistency, error_budget_compliance, performance_sla
    #     Referem-se a métricas de execução (contagem histórica, taxa de erro,
    #     tempo de resposta) que a PoC não coleta: não há runtime servindo os
    #     produtos. A intenção permanece declarada em standards.error_budgets e
    #     standards.performance, explicitamente sem verificação automatizada.
      
  # SLAs Globais
  # enforcement: automated — verified_by: check_slas
  # O perfil aplicável (default, critical, batch, real_time) é derivado de
  # customProperties.product_type: produto analítico responde pelo perfil batch.
  global_slas:
    enforcement: automated
    freshness:
      default: "PT6H"
      critical: "PT1H"
      batch: "P1D"
      real_time: "PT1M"
    
    availability:
      default: "99.0%"
      critical: "99.9%"
      batch: "95.0%"
      real_time: "99.5%"
    
    latency:
      default: "PT1S"
      critical: "PT100MS"
      batch: "PT1M"
      real_time: "PT50MS"
    
    throughput:
      default: "1000 msg/s"
      critical: "5000 msg/s"
      batch: "100 msg/s"
      real_time: "10000 msg/s"
  
  # Políticas de Evolução
  # enforcement: declaratory
  # reason: descreve PROCESSO — aprovação pelo data office, notificação de
  # consumidores, plano de rollback, análise de impacto. Nada disso é atributo
  # do contrato nem do dado. A parte verificável (compromisso declarado de
  # compatibilidade e prazo de depreciação) está em standards.evolution.
  evolution_policies:
    enforcement: declaratory
    backward_compatibility:
      required: true
      exceptions: ["emergency_fixes", "security_patches"]
      approval_process: "data_office_review"
    
    breaking_changes:
      approval_required: true
      notification_period: "P30D"
      rollback_plan: true
      consumer_impact_analysis: true
    
    deprecation:
      min_period: "P90D"
      max_period: "P365D"
      notification_required: true
      migration_support: true
  
  # Monitoramento Obrigatório
  # enforcement: automated — verified_by: check_monitoring
  # Limitação: verifica que o contrato DECLARA cada métrica e alerta exigidos.
  # Nenhuma métrica é coletada: não há runtime que as emita.
  required_monitoring:
    enforcement: automated
    metrics:
      - name: "record_count"
        type: "counter"
        description: "Número de registros processados"
        required: true
      
      - name: "processing_latency"
        type: "histogram"
        description: "Latência de processamento"
        required: true
      
      - name: "error_rate"
        type: "gauge"
        description: "Taxa de erros"
        required: true
      
      - name: "freshness"
        type: "gauge"
        description: "Idade dos dados"
        required: true
      
      - name: "schema_validation_failures"
        type: "counter"
        description: "Falhas de validação de schema"
        required: true
    
    alerts:
      - name: "high_error_rate"
        condition: "error_rate > 0.05"
        severity: "critical"
        notification: ["data_office", "product_team"]
      
      - name: "stale_data"
        condition: "freshness > PT6H"
        severity: "warning"
        notification: ["product_team"]
      
      - name: "schema_validation_failure"
        condition: "schema_validation_failures > 0"
        severity: "error"
        notification: ["data_office", "product_team"]
      
      - name: "availability_drop"
        condition: "availability < 99.0%"
        severity: "critical"
        notification: ["data_office", "sre_team"]


  # Políticas de Segurança
  security_policies:
    enforcement: partial
    # enforcement: automated (apenas data_classification) — verified_by: check_security
    data_classification:
      - level: "public"
        requirements: ["basic_logging"]
      
      - level: "internal"
        requirements: ["rbac", "audit_log"]
      
      - level: "confidential"
        requirements: ["encryption", "rbac", "audit_log", "data_masking"]
      
      - level: "restricted"
        requirements: ["encryption", "rbac", "audit_log", "data_masking", "approval_required"]
    
    access_control:
      enforcement: declaratory
      # reason: não há sujeito, permissão ou sessão nesta PoC.
      principle: "least_privilege"
      review_frequency: "P90D"
      emergency_access: "break_glass"
    
    audit:
      enforcement: declaratory
      # reason: não há acesso a registrar; os artefatos são arquivos locais.
      log_all_access: true
      retention_period: "P365D"
      tamper_protection: true
  
  # Políticas de Documentação
  # enforcement: declaratory
  # reason: refere-se à documentação do PRODUTO (páginas de catálogo), não ao
  # contrato. As exigências sobre o contrato estão em standards.documentation,
  # essas sim verificadas.
  documentation_policies:
    enforcement: declaratory
    required_sections:
      - "overview"
      - "schema_description"
      - "usage_examples"
      - "quality_metrics"
      - "contact_information"
    
    update_frequency:
      schema_changes: "immediate"
      quality_rules: "weekly"
      contact_info: "monthly"
    
    approval:
      major_changes: "data_office_review"
      minor_changes: "product_team_approval"
  
  # Política de Interoperabilidade (Governança Federativa)
  # Garante que produtos de dados de diferentes domínios possam ser combinados,
  # consumidos e integrados sem fricção, respeitando autonomia dos domínios e
  # padrões globais definidos pelo Data Office.
  interoperability:
    enforcement: partial
    # Formatos abertos suportados pela malha
    data_formats:
      allowed: ["avro", "parquet", "json", "protobuf"]
      preferred: "avro"
      forbidden: ["proprietary", "xls", "csv_without_schema"]

    # Schema Registry como ponto central de evolução interoperável
    schema_registry:
      required: true
      endpoint_pattern: "^https?://.+"
      compatibility_mode: "backward"
      subject_naming: "{domain}-{product}-v{major}"

    # Protocolos de exposição/consumo entre domínios
    protocols:
      enforcement: declaratory
      # reason: a malha não expõe endpoint algum — os output ports são arquivos
      # JSONL locais. Não há protocolo em uso para confrontar com a lista.
      sync:
        allowed: ["http", "https", "grpc"]
      async:
        allowed: ["kafka", "pulsar", "rabbitmq"]
        require_schema_registry: true
      batch:
        allowed: ["s3", "gcs", "abfs"]

    # ----------------------------------------------------------------------
    # Master Entities — chaves de negócio globais governadas federativamente.
    # Quando o backbone operacional é compartilhado entre domínios (ex.: ERP único),
    # estas chaves representam entidades-mestre reais (faturas, clientes, fornecedores)
    # e podem ser publicadas em múltiplos output ports para permitir reconciliação
    # fina (entity analytical products), sob governança federada de formato
    # e ciclo de vida.
    # Importante: compartilhar a chave NÃO elimina divergências de vocabulário,
    # regras de domínio, granularidade ou janela temporal — apenas viabiliza a
    # detecção fatura-a-fatura. Continua sendo necessária a canonicalização semântica.
    master_entities:
      - id: "invoice"
        canonical_field: "invoice_id"
        format:
          type: "string"
          pattern: "^INV-[0-9]+$"
          case_sensitive: true
        issuing_authority: "billing-system"        # sistema-fonte autoritativo
        lifecycle: "immutable_once_emitted"
        published_in_products:
          - "contas-a-pagar"
          - "contas-a-receber"
          - "operacoes-logistica"
        cross_product_assertions:
          # Mesmo invoice_id presente em AP e AR deve representar a MESMA fatura.
          # Divergências em status/valor são esperadas (regras de domínio).
          - "ap.invoice_id == ar.invoice_id => same_real_invoice"
          # No output port analítico de Logística a chave publicada é
          # `invoice_id`; `related_invoice_id` é o nome na camada operacional.
          - "logistics.invoice_id == ap.invoice_id => same_real_invoice"

      # O campo canônico é o nome do atributo COMO PUBLICADO nos output ports
      # analíticos (id_cliente, id_fornecedor), não o nome da camada
      # operacional de origem (customer_id, supplier_id). A política governa o
      # produto publicado; declarar o nome operacional tornava a política
      # inverificável — nenhum produto expõe esse atributo.
      - id: "customer"
        canonical_field: "id_cliente"
        format:
          type: "string"
          pattern: "^CUS-[0-9]+$"
          case_sensitive: true
        issuing_authority: "crm-system"
        lifecycle: "stable"
        published_in_products:
          - "contas-a-receber"

      - id: "supplier"
        canonical_field: "id_fornecedor"
        format:
          type: "string"
          pattern: "^SUP-[0-9]+$"
          case_sensitive: true
        issuing_authority: "procurement-system"
        lifecycle: "stable"
        published_in_products:
          - "contas-a-pagar"

    # Identificadores globais compartilhados entre produtos analíticos federados.
    # Usa os campos canônicos da malha (dsc_dominio/dsc_produto/dt_versao), que
    # todos os output ports analíticos publicam.
    shared_identifiers:
      required_fields:
        - "dsc_dominio"       # produto pertence a um domínio (Domain Ownership)
        - "dsc_produto"       # nome do produto de dados (descoberta no catálogo)
        - "dt_versao"         # timestamp de materialização (UTC)
      # Dimensões usadas para junção entre produtos analíticos de domínios diferentes
      cross_domain_keys:
        - "mes_emissao"
        - "meses_operacao"
        - "status"
        - "dsc_moeda"
      id_format:
        type: "string"
        pattern: "^[A-Za-z0-9_:|-]{1,64}$"
        case_sensitive: true

    # Padrões semânticos compartilhados (vocabulário comum)
    semantic_standards:
      datetime:
        format: "ISO-8601"
        timezone: "UTC"
        field_type: "string"        # ISO-8601 armazenado como string
        field_name: "dt_versao"     # campo canônico de materialização (UTC)
      date:
        format: "YYYY-MM-DD"
        field_type: "date"
      currency:
        standard: "ISO-4217"
        allowed: ["BRL"]
        field_name: "dsc_moeda"
      amount:
        precision: 2
        type: "number"
        non_negative: true
      language: "pt-BR"
      encoding: "UTF-8"

    # Convenções de nomenclatura federadas
    naming_conventions:
      fields: "snake_case"
      datasets: "snake_case"
      products: "kebab-case"
      domains: "kebab-case"
      max_identifier_length: 50

    # Catálogo e descoberta (federação)
    catalog:
      registration_required: true
      discoverability: "mesh-wide"
      metadata_standard: "DCAT"
      required_metadata:
        - "owner"
        - "domain"
        - "version"
        - "tags"
        - "description"

    # Linhagem federada entre produtos analíticos
    federated_lineage:
      required: true
      propagation: "automatic"
      # No nível analítico a linhagem usa os campos canônicos da malha.
      trace_fields:
        - "dsc_dominio"
        - "dsc_produto"
        - "dt_versao"
      # Linhagem upstream é declarada em metadata.upstream em cada contrato.
      upstream_declaration: "metadata.upstream"

    # Versionamento semântico interoperável
    versioning:
      enforcement: automated          # verified_by: interop_semver (formato)
      # Limitação: verifica-se o FORMATO X.Y.Z. A correspondência entre tipo de
      # mudança e incremento (major/minor/patch) exigiria histórico de versões.
      scheme: "semver"
      breaking_change: "major"
      backward_compatible_addition: "minor"
      bugfix: "patch"
      deprecation_period: "P90D"

    # Contratos de consumo padronizados (consumer-driven contracts)
    consumer_contracts:
      required: true
      negotiation: "data_office_mediated"
      change_notice_period: "P30D"

  # Validação de Compliance
  # enforcement: declaratory
  # reason: LGPD, SOX e ISO 27001 se cumprem com processo organizacional,
  # evidência e auditoria externa. Declará-los no artefato não os implementa, e
  # nenhuma checagem aqui poderia atestá-los.
  compliance_requirements:
    enforcement: declaratory
    frameworks:
      - name: "LGPD"
        requirements: ["data_minimization", "consent_management", "data_subject_rights"]
      
      - name: "SOX"
        requirements: ["data_integrity", "audit_trail", "segregation_of_duties"]
      
      - name: "ISO_27001"
        requirements: ["information_security", "risk_management", "continuous_improvement"]
    
    validation_frequency:
      automated_checks: "daily"
      manual_review: "monthly"
      external_audit: "annually"