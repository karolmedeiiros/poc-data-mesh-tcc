apiVersion: v1
kind: DataProductContract
metadata:
  name: contas-a-pagar-invoice-keyed
  domain: financeiro
  product_type: analytical
  output_port_kind: entity_keyed   # diferencia do aggregate
  master_entity: invoice           # ver governance/policies.yaml > master_entities
  owner: "finance-ap@empresa.com"
  version: "1.0.0"
  tags: ["finance", "ap", "v1", "analytical", "entity-keyed", "invoice"]
  created_at: "2026-01-15T00:00:00Z"
  last_modified: "2026-01-15T00:00:00Z"
  upstream:
    - "contas-a-pagar"
spec:
  product:
    id: "dp-fin-ap-invoice-keyed"
    description: "Output port analítico de Contas a Pagar, chaveado por invoice_id (master entity)."
    sla:
      freshness: "P1D"
      availability: "99.0%"
      latency: "PT5S"
      throughput: "100 msg/s"
  schema:
    registry: "http://schema-registry:8081"
    subject: "ap-invoice-keyed-v1"
    format: "avro"
    evolution:
      policy: "backward_compatible"
      breaking_changes: "require_major_version"
      deprecation_period: "P90D"
  dataset:
    name: "ap_invoice_keyed"
    primaryKey: ["invoice_id"]
    fields:
      - { name: invoice_id, type: string, required: true, description: "Master entity (federated)" }
      - { name: issue_month, type: string, required: true }
      - { name: status, type: string, required: true, enum: ["OPEN", "PAID", "CANCELED"] }
      - { name: invoice_type, type: string, required: true }
      - { name: supplier_id, type: string, required: true }
      - { name: amount, type: number, required: true }
      - { name: base_amount, type: number, required: true }
      - { name: currency, type: string, required: true, enum: ["BRL"] }
      - { name: domain, type: string, required: true }
      - { name: product, type: string, required: true }
  quality:
    rules:
      - { id: "ap-k-invoice-id-format", description: "invoice_id deve casar com master_entity invoice", expression: "REGEXP_MATCH(invoice_id, '^INV-[0-9]+$')", severity: "error" }
      - { id: "ap-k-positive-amount", description: "amount > 0", expression: "amount > 0", severity: "error" }
      - { id: "ap-k-currency-brl", description: "currency BRL", expression: "currency == 'BRL'", severity: "error" }
      - { id: "ap-k-valid-status", description: "status válido", expression: "status IN ['OPEN','PAID','CANCELED']", severity: "error" }
  tests:
    unit:
      - { name: "id_format_ok", input: { "invoice_id": "INV-1001" }, expected: "valid" }
      - { name: "currency_brl", input: { "currency": "BRL" }, expected: "valid" }
    integration:
      - { name: "invoice_id_unique", description: "primary key única", setup: "load_keyed_dataset", test: "assert_unique(invoice_id)", expected: "true" }
  consumers:
    - name: "cross-domain-reconciliation"
      version: ">=1.0.0"
      contact: "data-platform@empresa.com"
      expectations:
        - { field: "invoice_id", required: true }
        - { field: "amount", type: "number", required: true }
    - name: "finance-master-data"
      version: ">=1.0.0"
      contact: "mdm@empresa.com"
      expectations:
        - { field: "invoice_id", required: true }
        - { field: "supplier_id", required: true }
  monitoring:
    metrics:
      - { name: "record_count", type: "counter" }
      - { name: "processing_latency", type: "histogram" }
      - { name: "error_rate", type: "gauge" }
      - { name: "freshness", type: "gauge" }
      - { name: "schema_validation_failures", type: "counter" }
    alerts:
      - { name: "high_error_rate", condition: "error_rate > 0.05", severity: "critical" }
      - { name: "stale_data", condition: "freshness > P1D", severity: "warning" }
      - { name: "schema_validation_failure", condition: "schema_validation_failures > 0", severity: "error" }
      - { name: "availability_drop", condition: "availability < 99.0%", severity: "critical" }
