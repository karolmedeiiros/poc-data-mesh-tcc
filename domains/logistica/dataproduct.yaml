apiVersion: v1
kind: DataProductContract
metadata:
  name: operacoes-logistica-invoice-keyed
  domain: logistica
  product_type: analytical
  output_port_kind: entity_keyed
  master_entity: invoice
  owner: "logistics-team@empresa.com"
  version: "1.0.0"
  tags: ["logistics", "v1", "analytical", "entity-keyed", "invoice"]
  created_at: "2026-01-15T00:00:00Z"
  last_modified: "2026-01-15T00:00:00Z"
  upstream:
    - "operacoes-logistica"
spec:
  product:
    id: "dp-log-ops-invoice-keyed"
    description: "Output port analítico de Logística, chaveado por invoice_id (apenas operações ligadas a faturas)."
    sla:
      freshness: "P1D"
      availability: "99.0%"
      latency: "PT5S"
      throughput: "100 msg/s"
  schema:
    registry: "http://schema-registry:8081"
    subject: "logistics-invoice-keyed-v1"
    format: "avro"
    evolution:
      policy: "backward_compatible"
      breaking_changes: "require_major_version"
      deprecation_period: "P90D"
  dataset:
    name: "logistics_invoice_keyed"
    primaryKey: ["invoice_id"]
    fields:
      - { name: invoice_id, type: string, required: true, description: "Master entity (federated), pode ter N operações" }
      - { name: operation_count, type: integer, required: true, constraints: { minInclusive: 1 } }
      - { name: total_value, type: number, required: true }
      - { name: operation_types, type: array, required: true }
      - { name: statuses, type: array, required: true }
      - { name: operation_months, type: array, required: true }
      - { name: currency, type: string, required: true, enum: ["BRL"] }
      - { name: domain, type: string, required: true }
      - { name: product, type: string, required: true }
  quality:
    rules:
      - { id: "log-k-invoice-id-format", description: "invoice_id deve casar com master_entity invoice", expression: "REGEXP_MATCH(invoice_id, '^INV-[0-9]+$')", severity: "error" }
      - { id: "log-k-positive-count", description: "operation_count >= 1", expression: "operation_count >= 1", severity: "error" }
      - { id: "log-k-currency-brl", description: "currency BRL", expression: "currency == 'BRL'", severity: "error" }
      - { id: "log-k-valid-status", description: "status válido em pelo menos uma operação", expression: "ANY(statuses, s => s IN ['PENDING','PROCESSING','COMPLETED','CANCELLED'])", severity: "error" }
  tests:
    unit:
      - { name: "id_format_ok", input: { "invoice_id": "INV-1001" }, expected: "valid" }
    integration:
      - { name: "invoice_id_unique", description: "primary key única", setup: "load_keyed_dataset", test: "assert_unique(invoice_id)", expected: "true" }
  consumers:
    - name: "cross-domain-reconciliation"
      version: ">=1.0.0"
      contact: "data-platform@empresa.com"
      expectations:
        - { field: "invoice_id", required: true }
        - { field: "total_value", type: "number", required: true }
  monitoring:
    metrics:
      - { name: "record_count", type: "counter" }
      - { name: "processing_latency", type: "histogram" }
      - { name: "error_rate", type: "gauge" }
      - { name: "freshness", type: "gauge" }
      - { name: "schema_validation_failures", type: "counter" }
    alerts:
      - { name: "high_error_rate", condition: "error_rate > 0.05", severity: "critical" }
      - { name: "stale_data", condition: "freshness > P1D", severity: "warning" }
      - { name: "schema_validation_failure", condition: "schema_validation_failures > 0", severity: "error" }
      - { name: "availability_drop", condition: "availability < 99.0%", severity: "critical" }
